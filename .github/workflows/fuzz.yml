name: Fuzz

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      fuzz_time:
        description: Time per fuzz target
        required: false
        default: 30s

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run fuzzers
        env:
          FUZZ_TIME: ${{ inputs.fuzz_time || '30s' }}
        run: make fuzz
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus
          path: |
            testdata/fuzz/
            protocol/testdata/fuzz/
            cmd/roughtime/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 30
