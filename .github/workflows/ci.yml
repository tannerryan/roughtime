name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          install-tools: "true"
      - run: make verify verify-tidy verify-vendor
      - run: make fmt && git diff --exit-code
      - run: make lint
      - run: make lint GOOS=openbsd
      - run: make lint GOOS=freebsd
      - run: make vuln
      - run: make test-race

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: freebsd, goarch: amd64 }
          - { goos: openbsd, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: make build GOOS=${{ matrix.target.goos }} GOARCH=${{ matrix.target.goarch }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag roughtime:ci .
