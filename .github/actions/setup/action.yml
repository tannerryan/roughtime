name: Set up Go
description: Configure Go, optionally installing Makefile dev tools.

inputs:
  install-tools:
    description: If 'true', install the lint and vulnerability tools.
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version: "1.27.x"
        check-latest: true

    - if: inputs.install-tools == 'true'
      shell: bash
      run: make deps-ci
