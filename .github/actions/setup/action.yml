name: Set up Go
description: Configure Go from go.mod, optionally installing Makefile dev tools.

inputs:
  install-tools:
    description: If 'true', install the lint and vulnerability tools.
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        check-latest: true

    - if: inputs.install-tools == 'true'
      shell: bash
      run: make deps-ci
